name: Test Integration

on:
  workflow_dispatch:
  workflow_call:

jobs:

  test-integration:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [ Debug, Release ]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5      # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: |
            10.x.x
            9.x.x
            8.x.x

      - name: Test Integration
        run: |
          test()
          {
            local framework="$1"

            dotnet build ./test-integration -f "$framework"
            local version=$(dotnet list ./test-integration package -f "$framework" | grep -E '^\s*>\s*Jitest\s+' | awk '{print $NF}')

            {
              echo "## $framework (Integration Test - Jitest $version)"
              echo
              echo '```'
              dotnet run \
                -p:"NoWarn=\$(NoWarn),NETSDK1138" \
                --project ./test-integration \
                -f "$framework" \
                -c "${{ matrix.configuration }}"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          for framework in net10.0 net9.0 net8.0; do
            test "$framework"
          done
