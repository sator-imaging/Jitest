name: Test

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '.github/**' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '.github/**' ]
  workflow_dispatch:
  workflow_call:

jobs:

  test:

    # FIX: cannot use ubuntu-latest/slim for net5.0
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        configuration: [ Debug, Release ]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5      # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: |
            10.x.x
            9.x.x
            8.x.x
            7.x.x
            6.x.x
            5.x.x

      - run: dotnet run eng/CodeGenerator.cs

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        if: matrix.configuration == 'Debug'
        with:
          commit-message: "Update generated source code"
          title: "[bot] dotnet run `eng/CodeGenerator.cs`"
          body: "Automated source code generation update."
          branch: "bot/eng-code-generator"

      - name: Test
        run: |
          test()
          {
            local framework="$1"

            dotnet build ./sandbox -f "$framework"

            {
              echo "## $framework (Sandbox)"
              echo
              echo '```'
              # %24 is '$' and %3B is ';' URL-encoded so MSBuild parses $(NoWarn);NETSDK1138 correctly in bash without splitting parameters on semicolons
              dotnet run \
                -p:NoWarn="%24(NoWarn)%3BNETSDK1138" \
                --project ./sandbox \
                -f "$framework" \
                -c "${{ matrix.configuration }}"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          for framework in net10.0 net9.0 net8.0 net7.0 net6.0 net5.0; do
            test "$framework"
          done
