name: Test

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '.github/**' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '.github/**' ]
  workflow_dispatch:
  workflow_call:

jobs:

  test:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        dotnet-major: [ '10', '9', '8', '7', '6', '5' ]
        configuration: [ Debug, Release ]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5      # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: |
            ${{ dotnet-major }}.x.x

      - name: Test
        run: |
          dotnet run -c ${{ matrix.configuration }} \
            -f net${{ matrix.dotnet-major }}.0 \
            --project ./sandbox
